<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>استمارة متطلبات العميل | CORE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Michroma&display=swap">
<style>
/* Layout: desktop = sticky command rail (progress ring + section nav) beside a full-width card grid; phone = sticky top bar with a numbered strip, single column.
   Colour: brand black/white bookends, eight section hues that bloom as you scroll. The live accent --a follows the section in view. */
@property --a{syntax:"<color>";inherits:true;initial-value:#f4f4f2}
:root{
  --bg:#050505;
  --surface:rgba(255,255,255,.045);
  --fg:#f4f4f2;
  --rgb-fg:244,244,242;
  --muted:#a4a4a0;
  --line:rgba(255,255,255,.13);
  --chip:rgba(255,255,255,.24);
  --on-a:#050505;
  --c0:#f4f4f2;--c1:#ffb23e;--c2:#ff6f61;--c3:#5b9bff;--c4:#38d9e8;--c5:#3ddc97;--c6:#b497ff;--c7:#ff7eb6;--c8:#c3ea4a;--c9:#f4f4f2;
  --a:var(--c0);
  --font-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --font-display:"Michroma","Arial Black",Arial,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
  transition:--a .8s ease;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eef0f3;--surface:rgba(255,255,255,.78);--fg:#0b0b0c;--rgb-fg:11,11,12;--muted:#565b63;--line:rgba(11,11,12,.15);--chip:rgba(11,11,12,.3);--on-a:#ffffff;
  --c0:#0b0b0c;--c1:#b45309;--c2:#c8372d;--c3:#2563eb;--c4:#0e7490;--c5:#047857;--c6:#6d28d9;--c7:#be185d;--c8:#4d7c0f;--c9:#0b0b0c;color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef0f3;--surface:rgba(255,255,255,.78);--fg:#0b0b0c;--rgb-fg:11,11,12;--muted:#565b63;--line:rgba(11,11,12,.15);--chip:rgba(11,11,12,.3);--on-a:#ffffff;
  --c0:#0b0b0c;--c1:#b45309;--c2:#c8372d;--c3:#2563eb;--c4:#0e7490;--c5:#047857;--c6:#6d28d9;--c7:#be185d;--c8:#4d7c0f;--c9:#0b0b0c;color-scheme:light}
:root[data-theme="dark"]{
  --bg:#050505;--surface:rgba(255,255,255,.045);--fg:#f4f4f2;--rgb-fg:244,244,242;--muted:#a4a4a0;--line:rgba(255,255,255,.13);--chip:rgba(255,255,255,.24);--on-a:#050505;
  --c0:#f4f4f2;--c1:#ffb23e;--c2:#ff6f61;--c3:#5b9bff;--c4:#38d9e8;--c5:#3ddc97;--c6:#b497ff;--c7:#ff7eb6;--c8:#c3ea4a;--c9:#f4f4f2;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.65;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.scroll{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:3px;z-index:61;pointer-events:none}
.scroll i{display:block;height:100%;transform-origin:100% 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5),var(--c6),var(--c7),var(--c8))}

.app{position:relative;z-index:1;max-width:2200px;margin-inline:auto;padding-left:var(--gl);padding-right:var(--gr)}
.main{min-width:0}

/* ---------- rail (phone: sticky top bar) ---------- */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));padding:10px var(--gr) 8px var(--gl);
  display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"rb now ring tools" "nav nav nav nav";gap:8px 12px;align-items:center;
  background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.rb{grid-area:rb;display:flex;align-items:center;gap:12px}
.rb img{width:40px;height:40px;border-radius:50%;display:block}
.rt{display:none}
.rt b{display:block;font-family:var(--font-display);font-size:15px;letter-spacing:.28em;font-weight:400}
.rt span{display:block;font-family:var(--font-display);font-size:8px;letter-spacing:.34em;color:var(--muted);margin-top:4px}
.now{grid-area:now;min-width:0;font-weight:600;font-size:15px;color:var(--a);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ringbox{grid-area:ring;position:relative;width:46px;height:46px;font-size:11px}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg);display:block;overflow:visible}
.ringbox circle{fill:none;stroke-width:7}
.ringbox .tr{stroke:var(--line)}
.ringbox .pg{stroke:var(--a);stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--a) 70%,transparent))}
.pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);direction:ltr;font-variant-numeric:tabular-nums}
.tools{grid-area:tools;display:flex;gap:8px;align-items:center}
.lbtn{font-family:var(--font-display);font-size:10px;letter-spacing:.02em;width:auto;min-width:42px;padding:0 12px;border-radius:999px}
.lbtn:hover{transform:none}
.tbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0;transition:border-color .2s,transform .3s}
.tbtn:hover{border-color:var(--a);transform:rotate(18deg)}
.tbtn svg{width:19px;height:19px}
.tbtn .moon{display:none}
.tbtn.light .sun{display:none}
.tbtn.light .moon{display:block}
.nav{grid-area:nav;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.nav::-webkit-scrollbar{display:none}
.nv{flex:none;position:relative;border:0;background:none;color:var(--fg);font:inherit;cursor:pointer;padding:0;text-align:start;display:block}
.nv .no{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--nc);color:var(--nc);display:grid;place-items:center;font-family:var(--font-display);font-size:10px;transition:background .25s,color .25s,transform .25s}
.nv .no svg{width:16px;height:16px}
.nv .tt,.nv .cnt{display:none}
.nv.on .no,.nv.done .no{background:var(--nc);color:var(--on-a)}
.nv.on .no{transform:scale(1.12)}
.nv:focus-visible,.chip input:focus-visible+span,button:focus-visible,.go:focus-visible{outline:2px solid var(--a);outline-offset:3px}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;gap:28px;padding-block:clamp(28px,6vw,64px) clamp(20px,4vw,44px)}
.tag{font-family:var(--font-display);font-size:11px;letter-spacing:.34em;color:var(--muted)}
.hero h1{margin:14px 0 18px;font-size:clamp(40px,10.5vw,112px);line-height:1.1;font-weight:600;text-wrap:balance}
.hero h1 .w{display:inline-block;animation:rise .95s cubic-bezier(.2,.9,.2,1) calc(var(--i) * .13s + .15s) both}
.hero h1 .grad{background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5),var(--c6),var(--c7),var(--c8),var(--c1));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:rise .95s cubic-bezier(.2,.9,.2,1) calc(var(--i) * .13s + .15s) both,slide 9s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(46%) skewY(5deg);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes slide{to{background-position:-300% 0}}
.sub{margin:0;color:var(--muted);font-size:clamp(16px,1.7vw,20px);max-width:44ch;text-wrap:balance;animation:fade 1s .7s both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:26px;animation:fade 1s .9s both}
.pill{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:999px;padding:6px 15px;font-size:13px}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--d);box-shadow:0 0 10px var(--d)}
.orb{position:relative;width:clamp(180px,52vw,240px);aspect-ratio:1;max-width:100%;order:-1;animation:orbin 1.3s cubic-bezier(.2,.9,.2,1) both}
@keyframes orbin{from{opacity:0;transform:scale(.6) rotate(-90deg)}to{opacity:1;transform:none}}
.orb .glow,.orb .ring{position:absolute;border-radius:50%;background:conic-gradient(var(--c1),var(--c2),var(--c7),var(--c6),var(--c3),var(--c4),var(--c5),var(--c8),var(--c1));animation:spin 14s linear infinite}
.orb .glow{inset:4%;filter:blur(34px);opacity:.55}
.orb .ring{inset:0;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px))}
.orb img{position:absolute;inset:7%;width:86%;height:86%;border-radius:50%;display:block}
.orb svg.txt{position:absolute;inset:-15%;width:130%;height:130%;animation:spin 46s linear infinite reverse;overflow:visible}
.orb svg.txt text{font-family:var(--font-display);font-size:9.5px;fill:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}

.marq{margin-block:12px 4px;border-block:1px solid var(--line);overflow:hidden;direction:ltr;padding-block:14px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;width:max-content;animation:marq 44s linear infinite}
.track span{display:inline-flex;align-items:center;gap:40px;padding-right:40px;font-family:var(--font-display);font-size:12px;letter-spacing:.34em;white-space:nowrap;color:var(--muted)}
.track i{width:8px;height:8px;border-radius:50%;background:var(--d);box-shadow:0 0 12px var(--d)}
@keyframes marq{to{transform:translateX(-50%)}}

/* ---------- sections & cards ---------- */
.sec{padding-block:clamp(40px,6vw,76px) 4px;scroll-margin-top:132px}
.sec>header{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px;overflow:clip}
.sec>header>div{min-width:0}
.sec .en{display:block;font-family:var(--font-display);font-size:11px;letter-spacing:.3em;color:var(--a);margin-bottom:12px;text-transform:uppercase}
.sec h2{margin:0;font-size:clamp(28px,4.4vw,54px);font-weight:600;line-height:1.15;text-wrap:balance}
.sec .big{flex:none;font-family:var(--font-display);font-size:clamp(70px,16vw,176px);line-height:.78;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--a) 60%,transparent);letter-spacing:-.05em;direction:ltr;user-select:none}
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;grid-auto-flow:dense}
.row{--mx:50%;--my:0%;position:relative;isolation:isolate;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 20px 22px;display:flex;flex-direction:column;gap:16px;
  transition:border-color .3s,transform .3s,opacity .8s cubic-bezier(.2,.8,.2,1)}
.row::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(280px circle at var(--mx) var(--my),color-mix(in srgb,var(--a) 22%,transparent),transparent 72%);opacity:0;transition:opacity .35s}
.row:hover::before,.row:focus-within::before{opacity:1}
.row:hover{transform:translateY(-3px)}
.row:focus-within{border-color:var(--a)}
.row::after{content:"";position:absolute;top:20px;inset-inline-end:20px;width:9px;height:9px;border-radius:50%;background:var(--a);box-shadow:0 0 12px var(--a);transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.row.done::after{transform:scale(1)}
.k{font-weight:600;font-size:16px;line-height:1.4;padding-inline-end:22px}
.k small{display:block;font-weight:300;font-size:12.5px;color:var(--muted);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;cursor:pointer}
.chip input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.chip span{display:inline-block;padding:7px 15px;border:1px solid var(--chip);border-radius:999px;font-size:14px;transition:background .2s,color .2s,border-color .2s,transform .2s}
.chip:hover span{border-color:var(--a);transform:translateY(-1px)}
.chip input:checked+span{background:var(--a);border-color:var(--a);color:var(--on-a);font-weight:500;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.09)}100%{transform:scale(1)}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=tel],input[type=date],select,textarea{width:100%;min-width:0;background:transparent;color:var(--fg);border:0;border-bottom:1px solid var(--line);border-radius:0;font:inherit;font-size:15px;padding:9px 2px;transition:border-color .25s}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
textarea{border:1px solid var(--line);border-radius:12px;padding:14px;min-height:130px;resize:vertical}
select{-webkit-appearance:none;appearance:none;cursor:pointer;padding-left:26px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:14px 55%,9px 55%;background-size:5px 5px;background-repeat:no-repeat}
select option{background:var(--bg);color:var(--fg)}
.app[dir="ltr"] select{padding-left:2px;padding-right:26px;background-position:calc(100% - 14px) 55%,calc(100% - 9px) 55%}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--a)}
textarea:focus-visible{box-shadow:0 0 0 1px var(--a)}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.ltr{direction:ltr;text-align:right}
.app[dir="ltr"] .ltr{text-align:left}

.rv{opacity:1}
.rv.pre{opacity:0;transform:translateY(30px) scale(.98)}
.sec>header.rv{transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1)}

/* ---------- finish ---------- */
.finish{margin-block:clamp(48px,7vw,96px) 40px;padding:clamp(24px,4vw,48px);border:1px solid var(--line);border-radius:22px;background:var(--surface);display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden}
.finish::before{content:"";position:absolute;inset:-40% -10% auto auto;width:60%;aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--c1),var(--c2),var(--c7),var(--c6),var(--c3),var(--c4),var(--c5),var(--c8),var(--c1));filter:blur(70px);opacity:.22;animation:spin 20s linear infinite;pointer-events:none}
.finish>*{position:relative}
.finish h2{margin:0;font-size:clamp(28px,4.2vw,52px);line-height:1.15;font-weight:600;text-wrap:balance}
.finish p{margin:0;color:var(--muted);max-width:52ch}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.go,button.ghost{font:inherit;font-size:16px;font-weight:600;cursor:pointer;border-radius:999px;padding:14px 30px;min-height:50px;transition:transform .2s,box-shadow .3s}
.go{border:0;text-decoration:none;display:inline-flex;align-items:center;gap:10px;color:var(--on-a);background:linear-gradient(90deg,var(--c1),var(--c2),var(--c7),var(--c6),var(--c3),var(--c4),var(--c5),var(--c8),var(--c1));background-size:300% 100%;animation:slide 8s linear infinite;box-shadow:0 8px 30px -8px color-mix(in srgb,var(--a) 70%,transparent)}
button.ghost{border:1px solid var(--chip);background:transparent;color:var(--fg)}
button:hover,.go:hover{transform:translateY(-2px)}
.go svg{width:20px;height:20px;flex:none}
.num{margin:0;font-size:14px;color:var(--muted)}
.numv{direction:ltr;unicode-bidi:isolate;color:var(--fg);font-variant-numeric:tabular-nums;user-select:all}
.status{color:var(--muted);font-size:14px;min-height:1.6em}
#out{display:none;font-size:14px;line-height:1.9;min-height:0}
#out.on{display:block}
.foot{padding-block:24px 12px;text-align:center}

/* ---------- desktop ---------- */
@media (min-width:961px){
  .app{display:grid;grid-template-columns:clamp(270px,21vw,340px) minmax(0,1fr);column-gap:clamp(28px,4.5vw,84px)}
  .rail{align-self:start;top:0;height:100vh;height:100dvh;margin:0;padding-block:34px 28px;padding-inline:0 clamp(16px,1.8vw,30px);display:flex;flex-direction:column;align-items:stretch;gap:24px;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:0;border-inline-end:1px solid var(--line);overflow-y:auto;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rt{display:block}
  .rb img{width:46px;height:46px}
  .now{display:none}
  .ringbox{width:136px;height:136px;font-size:27px;align-self:flex-start}
  .nav{flex-direction:column;overflow:visible;gap:3px}
  .nv{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:12px;padding:7px 10px;border-radius:12px;transition:background .25s}
  .nv:hover{background:color-mix(in srgb,var(--nc) 10%,transparent)}
  .nv.on{background:color-mix(in srgb,var(--nc) 16%,transparent)}
  .nv .no{width:32px;height:32px}
  .nv .tt,.nv .cnt{display:block}
  .nv .tt{font-size:14px;line-height:1.35;color:var(--muted);transition:color .25s}
  .nv.on .tt,.nv.done .tt{color:var(--fg)}
  .nv .cnt{font-family:var(--font-display);font-size:9.5px;color:var(--muted);direction:ltr}
  .tools{margin-top:auto}
  .hero{grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);justify-items:stretch;text-align:start;gap:40px;padding-block:clamp(40px,6vh,84px) clamp(28px,4vh,56px)}
  .hero h1{font-size:clamp(52px,6.4vw,124px)}
  .stats{justify-content:flex-start}
  .orb{order:0;width:clamp(220px,22vw,380px);justify-self:center}
  .sec{scroll-margin-top:24px}
}
@media (min-width:1100px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .w2{grid-column:span 2}
}
@media (min-width:1640px){
  .cards{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="scroll" aria-hidden="true"><i id="sbar"></i></div>

<div class="app" dir="rtl" lang="ar">
  <aside class="rail" id="rail">
    <div class="rb">
      <img data-logo alt="CORE Design Studio" width="46" height="46">
      <div class="rt"><b>CORE</b><span>DESIGN STUDIO</span></div>
    </div>
    <div class="now" id="now"></div>
    <div class="ringbox" aria-label="نسبة اكتمال الاستمارة">
      <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="tr" cx="60" cy="60" r="52"></circle><circle class="pg" id="pg" cx="60" cy="60" r="52"></circle></svg>
      <div class="pct"><span id="pct">0</span></div>
    </div>
    <div class="tools">
      <button type="button" class="tbtn lbtn" id="lang"><span id="lt">EN</span></button>
      <button type="button" class="tbtn" id="theme" aria-label="تبديل الوضع الفاتح والداكن">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>

  var cs=getComputedStyle(root);COL=[];
  for(var i=0;i<10;i++)COL.push(hex(cs.getPropertyValue('--c'+i).trim()||'#ffffff'));
  FG=cs.getPropertyValue('--rgb-fg').trim()||'244,244,242';
  tgt=COL[act]||tgt;if(RM){cur=tgt.slice();draw(0)}
}
function isLight(){var t=root.getAttribute('data-theme');if(t)return t==='light';try{return window.matchMedia('(prefers-color-scheme: light)').matches}catch(e){return false}}
function rgba(c,a){return 'rgba('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+','+a+')'}

/* ---------- canvas: blueprint dots, pointer glow, bursts ---------- */
var cv=document.getElementById('bg'),ctx=cv.getContext('2d'),vw=0,vh=0,dpr=1,px=0,py=0,tx=0,ty=0,lastMove=-9999,sy=0,P=[];
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);vw=window.innerWidth;vh=window.innerHeight;cv.width=vw*dpr;cv.height=vh*dpr;if(!px){px=tx=vw*.6;py=ty=vh*.35}if(RM)draw(0)}
function burst(x,y,c,n,pw,multi){
  if(RM||!COL.length)return;
  for(var i=0;i<n;i++){var a=Math.random()*6.283,sp=(.4+Math.random())*pw;
    P.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-pw*.45,l:1,d:.011+Math.random()*.013,z:2+Math.random()*3.4,c:multi?COL[1+Math.floor(Math.random()*8)]:(c||cur)})}
  if(P.length>420)P.splice(0,P.length-420)
}
function draw(t){
  var light=isLight(),i,j;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,vw,vh);
  for(i=0;i<3;i++)cur[i]+=(tgt[i]-cur[i])*(RM?1:.05);
  if(!RM){if(t-lastMove>2600){tx=vw*(.55+.3*Math.cos(t/4300));ty=vh*(.42+.26*Math.sin(t/5600))}px+=(tx-px)*.07;py+=(ty-py)*.07}
  var r=Math.max(vw,vh)*.4,g=ctx.createRadialGradient(px,py,0,px,py,r);
  g.addColorStop(0,rgba(cur,light?.17:.22));g.addColorStop(1,rgba(cur,0));ctx.fillStyle=g;ctx.fillRect(0,0,vw,vh);
  var c2=COL[(act+1)%10]||cur,ox=vw*(.82+.12*Math.cos(t/6200)),oy=vh*(.2+.16*Math.sin(t/4700)),r2=Math.max(vw,vh)*.3,g2=ctx.createRadialGradient(ox,oy,0,ox,oy,r2);
  g2.addColorStop(0,rgba(c2,light?.10:.13));g2.addColorStop(1,rgba(c2,0));ctx.fillStyle=g2;ctx.fillRect(0,0,vw,vh);
  var gap=38,off=-((sy*.2)%gap),R=250,R2=R*R;
  ctx.beginPath();
  for(i=gap/2;i<vw;i+=gap)for(j=off;j<vh+gap;j+=gap)ctx.rect(i-.75,j-.75,1.5,1.5);
  ctx.fillStyle='rgba('+FG+','+(light?.17:.12)+')';ctx.fill();
  for(i=gap/2;i<vw;i+=gap)for(j=off;j<vh+gap;j+=gap){
    var dx=i-px,dy=j-py,d2=dx*dx+dy*dy;
    if(d2<R2){var k=1-Math.sqrt(d2)/R,s=1.5+k*3.4;ctx.fillStyle=rgba(cur,.22+k*.7);ctx.fillRect(i-s/2,j-s/2,s,s)}
  }
  for(i=P.length-1;i>=0;i--){var p=P[i];p.vy+=.14;p.vx*=.986;p.x+=p.vx;p.y+=p.vy;p.l-=p.d;
    if(p.l<=0){P.splice(i,1);continue}
    ctx.fillStyle=rgba(p.c,Math.min(1,p.l*1.4));ctx.fillRect(p.x,p.y,p.z,p.z*.6)}
}
window.addEventListener('resize',resize);
window.addEventListener('pointermove',function(e){tx=e.clientX;ty=e.clientY;lastMove=performance.now()},{passive:true});
if(!RM)requestAnimationFrame(function L(t){draw(t);requestAnimationFrame(L)});

/* ---------- theme & language buttons ---------- */
var tb=document.getElementById('theme');
function syncTheme(){tb.classList.toggle('light',isLight());refreshColors()}
tb.onclick=function(){var next=isLight()?'dark':'light';root.setAttribute('data-theme',next);try{localStorage.setItem('core-theme',next)}catch(e){}syncTheme()};
try{var sv=localStorage.getItem('core-theme');if(sv==='light'||sv==='dark')root.setAttribute('data-theme',sv)}catch(e){}
try{window.matchMedia('(prefers-color-scheme: light)').addEventListener('change',syncTheme)}catch(e){}
try{new MutationObserver(syncTheme).observe(root,{attributes:true,attributeFilter:['data-theme']})}catch(e){}
document.getElementById('lang').onclick=function(){
  save();LI=LI?0:1;try{localStorage.setItem('core-lang',LI?'en':'ar')}catch(e){}
  var y=window.scrollY;init=true;armed=false;
  applyLang();buildHero();mount(false);
  root.style.scrollBehavior='auto';window.scrollTo(0,y);root.style.scrollBehavior='';
  update();setActive(act);init=false;
};

/* ---------- state ---------- */
var KEY='core-brief-v2';
function save(){try{var d={};all().forEach(function(e){d[e.id]=(e.type==='checkbox'||e.type==='radio')?e.checked:e.value});localStorage.setItem(KEY,JSON.stringify(d))}catch(x){}}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d)return;all().forEach(function(e){if(!(e.id in d))return;if(e.type==='checkbox'||e.type==='radio')e.checked=!!d[e.id];else e.value=d[e.id]})}catch(x){}}
function filled(el){var a=el.querySelectorAll('input,select,textarea');for(var i=0;i<a.length;i++){var e=a[i];if((e.type==='checkbox'||e.type==='radio')?e.checked:!!e.value)return true}return false}

/* NOTE: saved chip/select values are stored by id; selects store the visible text, so a language switch re-maps them by index */
var prevPct=0,shown=0,pctEl=document.getElementById('pct'),pg=document.getElementById('pg'),CIRC=326.7;
function tween(to){var from=shown,t0=performance.now();if(RM){shown=to;pctEl.textContent=to;return}
  (function s(n){var k=Math.min(1,(n-t0)/700),e=1-Math.pow(1-k,3);shown=Math.round(from+(to-from)*e);pctEl.textContent=shown;if(k<1)requestAnimationFrame(s)})(t0)}
function update(){
  var tot=0,dn=0;
  U.forEach(function(rows,si){
    var n=0;rows.forEach(function(r){var f=filled(r);r.classList.toggle('done',f);if(f)n++});
    tot+=rows.length;dn+=n;
    var nv=NV[si],full=rows.length>0&&n===rows.length;
    nv.querySelector('.cnt').textContent=n+'/'+rows.length;
    nv.classList.toggle('done',full);
    nv.querySelector('.no').innerHTML=full?CHECK:pad(si);
    if(!init&&full&&!prevDone[si]){var b=nv.getBoundingClientRect();burst(b.left+b.width/2,b.top+b.height/2,COL[si],46,5.2)}
    prevDone[si]=full;
  });
  var pc=tot?Math.round(dn/tot*100):0;
  pg.style.strokeDashoffset=CIRC*(1-pc/100);
  if(pc!==prevPct)tween(pc);
  if(!init&&pc===100&&prevPct!==100){burst(vw/2,vh*.9,null,160,9.5,true)}
  prevPct=pc;
  document.getElementById('ft').textContent=pc===0?tt('ft0'):(pc===100?tt('ft100'):tt('ftN').replace('{n}',pc));
  document.getElementById('fs').textContent=pc===100?tt('fs100'):tt('fs');
  refreshLink();
}
F.addEventListener('input',function(){save();update()});
F.addEventListener('change',function(e){save();update();
  var t=e.target;if(t&&(t.type==='checkbox'||t.type==='radio')&&t.checked){var sp=t.nextElementSibling.getBoundingClientRect(),i=+t.closest('.sec').dataset.i;burst(sp.left+sp.width/2,sp.top+sp.height/2,COL[i],12,3.2)}});
F.addEventListener('submit',function(e){e.preventDefault()});
F.addEventListener('pointermove',function(e){var r=e.target.closest&&e.target.closest('.row');if(!r)return;var b=r.getBoundingClientRect();r.style.setProperty('--mx',(e.clientX-b.left)+'px');r.style.setProperty('--my',(e.clientY-b.top)+'px')});

/* ---------- active section ---------- */
var nowEl=document.getElementById('now');
function setActive(i){
  act=i;tgt=COL[i]||tgt;root.style.setProperty('--a','var(--c'+i+')');
  nowEl.textContent=pad(i)+'  '+X(S[i].t);
  NV.forEach(function(n,k){n.classList.toggle('on',k===i)});

}

/* ---------- scroll bar ---------- */
var sb=document.getElementById('sbar'),tick=false;
function onScroll(){sy=window.scrollY||0;if(tick)return;tick=true;requestAnimationFrame(function(){tick=false;var m=Math.max(1,root.scrollHeight-window.innerHeight);sb.style.transform='scaleX('+Math.min(1,sy/m)+')'})}
window.addEventListener('scroll',onScroll,{passive:true});

/* ---------- summary & actions ---------- */
function summary(){
  var L=[tt('sumT'),''],sep=LI?', ':'، ';
  S.forEach(function(s,si){
    var out=[];
    SEC[si].querySelectorAll('.row').forEach(function(r){
      var p=[],chips=r.querySelectorAll('input[type=checkbox]:checked,input[type=radio]:checked'),flds=[];
      Array.prototype.forEach.call(chips,function(e){p.push(e.value)});
      Array.prototype.forEach.call(r.querySelectorAll('input[type=text],input[type=tel],input[type=date],select,textarea'),function(e){if(e.value)flds.push(e)});
      flds.forEach(function(e){var alone=e.dataset.note||e.dataset.one||(!chips.length&&flds.length===1);p.push((alone?'':e.dataset.l+': ')+e.value)});
      if(p.length)out.push('- '+r.dataset.k+': '+p.join(sep))
    });
    if(out.length){L.push('','*'+X(s.t)+'*');L=L.concat(out)}
  });
  return L.join('\n');
}
function flash(m){ST.textContent=m;setTimeout(function(){if(ST.textContent===m)ST.textContent=''},4000)}
var snd=document.getElementById('send');
function refreshLink(){if(snd)snd.href='https://wa.me/201282226490?text='+encodeURIComponent(summary())}
snd.addEventListener('click',function(){refreshLink();var b=snd.getBoundingClientRect();burst(b.left+b.width/2,b.top+b.height/2,null,50,6,true);flash(tt('sent'))});

cb.onclick=function(){

  armed=false;cb.textContent=tt('clear');F.reset();prevDone=[];init=true;
  var d=document.getElementById('r0_4_f0');if(d)d.value=today();
  save();update();init=false;flash(tt('cleared'))
};
